<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Hoxicoco</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Global CSS -->
  <link rel="stylesheet" href="../assets/global.css">
  
  <!-- Admin CSS -->
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- ADMIN PORTAL - Dashboard quản trị -->
  
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar__header">
        <h2>🔒 Admin Panel</h2>
      </div>
      
      <nav class="admin-sidebar__nav">
        <a href="#dashboard" class="nav-item active">📊 Dashboard</a>
        <a href="#toilets" class="nav-item">🚻 Quản lý WC</a>
        <a href="#reports" class="nav-item">📝 Báo cáo</a>
        <a href="#users" class="nav-item">👥 Người dùng</a>
        <a href="#settings" class="nav-item">⚙️ Cài đặt</a>
      </nav>
      
      <div class="admin-sidebar__footer">
        <button class="btn-logout">Đăng xuất</button>
      </div>
    </aside>
    
    <!-- Main Content -->
    <main class="admin-main">
      <!-- Header -->
      <header class="admin-header">
        <h1>Dashboard</h1>
        <div class="admin-header__user">
          <span>👤 Admin User</span>
        </div>
      </header>
      
      <!-- Content -->
      <div class="admin-content">
        <!-- Stats Cards -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-card__icon">🚻</div>
            <div class="stat-card__info">
              <h3>245</h3>
              <p>Tổng số WC</p>
            </div>
          </div>
          
          <div class="stat-card">
            <div class="stat-card__icon">📝</div>
            <div class="stat-card__info">
              <h3>18</h3>
              <p>Báo cáo chờ duyệt</p>
            </div>
          </div>
          
          <div class="stat-card">
            <div class="stat-card__icon">👥</div>
            <div class="stat-card__info">
              <h3>1,234</h3>
              <p>Người dùng</p>
            </div>
          </div>
          
          <div class="stat-card">
            <div class="stat-card__icon">⭐</div>
            <div class="stat-card__info">
              <h3>4.5</h3>
              <p>Điểm TB</p>
            </div>
          </div>
        </div>
        
        <!-- Recent Reports Table -->
        <div class="card">
          <div class="card__header">
            <h2>Báo cáo gần đây</h2>
          </div>
          <div class="card__body">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Địa điểm</th>
                  <th>Người báo cáo</th>
                  <th>Trạng thái</th>
                  <th>Hành động</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>#001</td>
                  <td>Công viên Lê Văn Tám</td>
                  <td>Nguyễn Văn A</td>
                  <td><span class="badge badge-pending">Chờ duyệt</span></td>
                  <td>
                    <button class="btn-sm btn-approve">✓ Duyệt</button>
                    <button class="btn-sm btn-reject">× Từ chối</button>
                  </td>
                </tr>
                <!-- TODO: Render động từ Firestore -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <!-- JavaScript -->
  <script type="module" src="js/admin.js"></script>
</body>
</html>
