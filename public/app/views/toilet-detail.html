<!-- TOILET DETAIL VIEW - Chi tiết nhà vệ sinh -->
<div class="modal">
  <div class="modal__header">
    <h2 class="modal__title">🚻 Chi tiết vị trí</h2>
    <button class="modal__close" onclick="closeModal()">×</button>
  </div>
  
  <div class="modal__body">
    <div class="toilet-detail">
      <!-- Hình ảnh -->
      <div class="toilet-detail__image">
        <img src="https://via.placeholder.com/500x300" alt="Toilet Image">
      </div>
      
      <!-- Thông tin cơ bản -->
      <div class="toilet-detail__info">
        <h3 id="toiletName">Nhà vệ sinh Công viên Lê Văn Tám</h3>
        <p id="toiletAddress">📍 123 Đường ABC, Quận 1, TP.HCM</p>
      </div>
      
      <!-- Điểm sạch sẽ -->
      <div class="clean-score">
        <div class="clean-score__value">
          <span class="score">85</span>
          <span class="label">CleanScore</span>
        </div>
        <div class="clean-score__status status-good">
          ✓ Sạch sẽ
        </div>
      </div>
      
      <!-- Tiện ích -->
      <div class="facilities">
        <h4>Tiện ích:</h4>
        <div class="facilities__list">
          <span class="badge">🚰 Nước sạch</span>
          <span class="badge">🧻 Giấy vệ sinh</span>
          <span class="badge">♿ Người khuyết tật</span>
        </div>
      </div>
      
      <!-- Đánh giá gần đây -->
      <div class="recent-reviews">
        <h4>Đánh giá gần đây:</h4>
        <div class="review-item">
          <p><strong>Nguyễn Văn A:</strong> "Rất sạch sẽ, có đầy đủ xà phòng"</p>
          <small>2 giờ trước</small>
        </div>
      </div>
    </div>
  </div>
  
  <div class="modal__footer">
    <button class="btn-primary" onclick="navigateToLocation()">Chỉ đường →</button>
  </div>
</div>
