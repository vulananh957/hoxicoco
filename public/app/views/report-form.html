<!-- REPORT FORM VIEW - Form báo cáo -->
<div class="modal">
  <div class="modal__header">
    <h2 class="modal__title">📝 Báo cáo nhà vệ sinh</h2>
    <button class="modal__close" onclick="closeModal()">×</button>
  </div>
  
  <div class="modal__body">
    <form id="reportForm" class="report-form">
      <!-- Vị trí -->
      <div class="form-group">
        <label for="location">📍 Vị trí:</label>
        <input 
          type="text" 
          id="location" 
          placeholder="Nhập địa chỉ hoặc chọn trên bản đồ"
          required
        >
      </div>
      
      <!-- Tên địa điểm -->
      <div class="form-group">
        <label for="placeName">🏢 Tên địa điểm:</label>
        <input 
          type="text" 
          id="placeName" 
          placeholder="VD: Công viên Lê Văn Tám"
          required
        >
      </div>
      
      <!-- Đánh giá độ sạch -->
      <div class="form-group">
        <label>⭐ Đánh giá độ sạch:</label>
        <div class="rating-buttons">
          <button type="button" class="rating-btn" data-rating="good">😊 Sạch</button>
          <button type="button" class="rating-btn" data-rating="average">😐 Tạm ổn</button>
          <button type="button" class="rating-btn" data-rating="bad">😞 Bẩn</button>
        </div>
      </div>
      
      <!-- Upload ảnh -->
      <div class="form-group">
        <label for="photos">📸 Tải ảnh lên:</label>
        <input 
          type="file" 
          id="photos" 
          accept="image/*"
          multiple
        >
        <small>Tối đa 5MB mỗi ảnh</small>
      </div>
      
      <!-- Ghi chú -->
      <div class="form-group">
        <label for="notes">📋 Ghi chú:</label>
        <textarea 
          id="notes" 
          rows="4" 
          placeholder="Mô tả chi tiết tình trạng..."
        ></textarea>
      </div>
    </form>
  </div>
  
  <div class="modal__footer">
    <button class="btn-primary" onclick="submitReportForm()">Gửi báo cáo</button>
  </div>
</div>

<style>
  .form-group {
    margin-bottom: var(--spacing-lg);
  }
  
  .form-group label {
    display: block;
    margin-bottom: var(--spacing-sm);
    font-weight: var(--font-weight-semibold);
    color: var(--text-main);
  }
  
  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: var(--spacing-sm) var(--spacing-md);
    border: 2px solid var(--bg-secondary);
    border-radius: var(--radius-md);
    font-size: var(--font-size-base);
    transition: border-color var(--transition-fast);
  }
  
  .form-group input:focus,
  .form-group textarea:focus {
    border-color: var(--color-primary);
    outline: none;
  }
  
  .rating-buttons {
    display: flex;
    gap: var(--spacing-sm);
  }
  
  .rating-btn {
    flex: 1;
    padding: var(--spacing-md);
    background-color: var(--bg-secondary);
    border: 2px solid transparent;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all var(--transition-fast);
  }
  
  .rating-btn:hover {
    border-color: var(--color-primary);
    transform: scale(1.02);
  }
  
  .rating-btn.active {
    background-color: var(--color-primary);
    color: white;
    border-color: var(--color-primary);
  }
</style>
