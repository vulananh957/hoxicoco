<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hoxicoco - Tìm kiếm nhà vệ sinh công cộng gần bạn">
  
  <title>Bản đồ - Hoxicoco</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Global CSS -->
  <link rel="stylesheet" href="../assets/global.css">
  
  <!-- App CSS -->
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body>
  <!-- USER WEB APP - Giao diện dành cho người dân -->
  
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="app-header__logo">
        <h1>🚻 Hoxicoco</h1>
      </div>
      <nav class="app-header__nav">
        <button id="btnProfile" class="btn-icon">👤</button>
        <button id="btnReport" class="btn-primary">➕ Báo cáo</button>
      </nav>
    </header>
    
    <!-- Map Container -->
    <main id="mapContainer" class="map-container">
      <div id="map" class="map">
        <!-- Bản đồ sẽ được render ở đây -->
        <div class="map-placeholder">
          <p>🗺️ Bản đồ đang được tích hợp...</p>
          <small>Mapbox/Google Maps API sẽ được thêm vào</small>
        </div>
      </div>
      
      <!-- Search Bar -->
      <div class="search-bar">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Tìm kiếm địa điểm..."
          class="search-bar__input"
        />
        <button id="btnCurrentLocation" class="btn-icon">📍</button>
      </div>
    </main>
    
    <!-- Modal Container (Load động các view) -->
    <div id="modalContainer"></div>
  </div>
  
  <!-- JavaScript Modules -->
  <script type="module" src="js/map-engine.js"></script>
  <script type="module" src="js/user-report.js"></script>
</body>
</html>
